<style>
:root{--g:#C99B54;--gd:#9c7338;--k:#000;--bg:#f3f3f1;--b:#dcdcd8;--t:#161616;--m:#6a6a66}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--t)}
button,input,select{font:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.btn{background:var(--k);color:#fff;border:0;border-radius:6px;padding:10px 16px;cursor:pointer;font-weight:600}
.btn:hover{background:#2a2a2a}
.btn.ghost{background:transparent;color:var(--t);border:1px solid var(--b)}
.btn.ghost:hover{background:#fff}
.btn.gold{background:var(--g);color:#000}
.btn.danger{background:#b3261e}
.btn.sm{padding:6px 11px;font-size:13px}
input,select{width:100%;padding:10px 12px;border:1px solid var(--b);border-radius:6px;background:#fff;color:var(--t)}
.sp{flex:1}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:3px solid var(--g);display:flex;align-items:center;gap:14px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top))}
header img{height:32px;display:block}
.search{max-width:380px;margin-left:auto}
.um{position:relative}
#menu{position:absolute;right:0;top:110%;background:#fff;border:1px solid var(--b);border-radius:8px;min-width:230px;padding:6px;box-shadow:0 8px 24px #0002}
#menu[hidden]{display:none}
#menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 10px;border-radius:6px;cursor:pointer}
#menu button:hover{background:var(--bg)}
#menu .who{padding:8px 10px;border-bottom:1px solid var(--b);margin-bottom:4px;font-size:13px;color:var(--m)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 16px 4px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--b);background:#fff;border-radius:999px;padding:7px 15px;cursor:pointer;font-weight:500}
.chip.on{background:var(--k);color:#fff;border-color:var(--k)}
.edbar{margin:10px 16px 0;padding:9px 12px;background:#fff;border-left:4px solid var(--g);display:flex;align-items:center;gap:12px;font-size:14px}
main{max-width:1100px;margin:0 auto;padding:8px 16px 48px}
.co{margin-top:26px}
.cohead{display:flex;align-items:center;gap:14px;padding:14px 16px;background:#fff;border:1px solid var(--b);border-left:8px solid var(--c);flex-wrap:wrap}
.cohead h2{margin:0;font-size:20px;letter-spacing:.2px}
.cohead p{margin:0;color:var(--m);font-size:13px}
.lg{width:44px;height:44px;flex:none;border-radius:6px;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:700;font-size:20px;overflow:hidden}
.lg img{width:100%;height:100%;object-fit:contain;background:#fff}
h4{margin:20px 2px 8px;font-size:14px;font-weight:700;color:var(--gd)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{position:relative;display:flex;align-items:center;gap:12px;padding:12px 40px 12px 12px;background:#fff;border:1px solid var(--b);border-radius:6px;text-decoration:none;min-width:0}
.card:hover{border-color:var(--k);box-shadow:3px 3px 0 var(--g)}
.ic{width:42px;height:42px;flex:none;border-radius:6px;background:var(--bg);display:grid;place-items:center;font-size:22px;font-weight:700}
.tx{min-width:0}
.tx b,.tx small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx small{color:var(--m)}
.fav,.ed{position:absolute;border:0;background:none;cursor:pointer;color:#bbb;font-size:18px;line-height:1;padding:4px}
.fav{top:8px;right:8px}
.fav.on{color:var(--g)}
.ed{bottom:6px;right:8px;font-size:15px;color:var(--t)}
.empty{text-align:center;color:var(--m);padding:40px 10px}
.auth{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px}
.auth>*{width:100%;max-width:340px}
.auth img{width:170px;display:block;margin:0 auto 22px}
.auth form{display:grid;gap:10px;background:#fff;border:1px solid var(--b);padding:22px}
.auth h2{margin:0 0 4px;text-align:center}
.mut{color:var(--m);font-size:13px;margin:4px 0 0;text-align:center}
.err{color:#b3261e;font-size:13px;margin:0;min-height:1em}
#modal:not(:empty){position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:20;padding:16px}
.box{background:#fff;border-radius:8px;width:100%;max-width:440px;max-height:90vh;overflow:auto;padding:20px;display:grid;gap:12px}
.box h3{margin:0}
.box label{display:grid;gap:4px;font-size:13px;color:var(--m)}
.box input[type=color]{padding:2px;height:40px}
.row{display:flex;gap:8px;align-items:center}
.urow{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--b)}
.urow div{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis}
.urow select{width:130px}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#000;color:#fff;padding:10px 16px;border-radius:6px;opacity:0;pointer-events:none;transition:.2s;z-index:30;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:600px){header img{height:26px}.search{max-width:none;flex:1;margin:0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let fav=[];try{fav=JSON.parse(localStorage.kg_fav||'[]')}catch{}
const S={user:null,me:null,cos:[],apps:[],sel:'all',q:'',edit:false,un:[],dn:[],mode:'in',shellRole:null,fav:new Set(fav)};
const isAdmin=()=>S.me?.role==='admin';
const safe=u=>/^https?:\/\//i.test(u)?u:'#';
const host=u=>{try{return new URL(u).host}catch{return u}};
const byN=(a,b)=>(a.order||0)-(b.order||0)||String(a.name).localeCompare(b.name);
const msg=e=>(e.code||e.message||String(e)).replace('auth/','').replace(/-/g,' ');
function toast(m){const t=$('#toast');t.textContent=m;t.className='show';clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='',3500)}
let installEv=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEv=e});

/* ---------- Auth ---------- */
function authView(){
  const up=S.mode==='up';
  $('#app').innerHTML=`<div class="auth"><img src="${LOGO}" alt="Kamil Group">
  <form id="af"><h2>${up?'Buat akun':'Masuk'}</h2>
  ${up?'<input name="name" placeholder="Nama lengkap" required>':''}
  <input name="email" type="email" placeholder="Email" autocomplete="email" required>
  <input name="password" type="password" placeholder="Kata sandi (min. 6 karakter)" minlength="6" autocomplete="${up?'new-password':'current-password'}" required>
  <button class="btn">${up?'Daftar':'Masuk'}</button>
  <p class="mut"><a href="#" data-act="mode">${up?'Sudah punya akun? Masuk':'Belum punya akun? Daftar'}</a></p>
  <p id="err" class="err"></p></form></div>`;
}
function pendingView(){
  $('#app').innerHTML=`<div class="auth"><img src="${LOGO}" alt="Kamil Group"><form onsubmit="return false"><h2>Menunggu persetujuan</h2>
  <p>Akun <b>${esc(S.user.email)}</b> sudah terdaftar. Admin perlu menyetujui akun ini sebelum Anda bisa melihat daftar aplikasi.</p>
  <button type="button" class="btn ghost" data-act="logout">Keluar</button></form></div>`;
  S.shellRole=null;
}
document.addEventListener('submit',async e=>{
  if(e.target.id!=='af')return;
  e.preventDefault();
  const f=new FormData(e.target),em=f.get('email'),pw=f.get('password');
  try{
    if(S.mode==='up'){
      S.pname=f.get('name');
      const cr=await createUserWithEmailAndPassword(auth,em,pw);
      await updateProfile(cr.user,{displayName:S.pname});
    }else await signInWithEmailAndPassword(auth,em,pw);
  }catch(x){$('#err').textContent=msg(x)}
});
onAuthStateChanged(auth,async u=>{
  S.un.forEach(f=>f());S.un=[];stopData();S.user=u;S.me=null;
  if(!u){S.shellRole=null;return authView()}
  const r=doc(db,'users',u.uid);
  try{
    const s=await getDoc(r);
    if(!s.exists())await setDoc(r,{email:u.email,name:S.pname||u.displayName||u.email.split('@')[0],role:'pending',createdAt:serverTimestamp()});
  }catch(x){toast(msg(x))}
  S.un.push(onSnapshot(r,d=>{S.me=d.data()||null;onRole()},x=>toast(msg(x))));
});
function stopData(){S.dn.forEach(f=>f());S.dn=[];S.cos=[];S.apps=[]}
function onRole(){
  if(!S.me)return;
  const r=S.me.role;
  if(r!=='member'&&r!=='admin'){stopData();return pendingView()}
  if(!isAdmin())S.edit=false;
  if(S.shellRole!==r){S.shellRole=r;shell()}
  if(!S.dn.length){
    S.dn.push(onSnapshot(collection(db,'companies'),q=>{S.cos=q.docs.map(d=>({id:d.id,...d.data()})).sort(byN);render()},x=>toast(msg(x))));
    S.dn.push(onSnapshot(collection(db,'apps'),q=>{S.apps=q.docs.map(d=>({id:d.id,...d.data()}));render()},x=>toast(msg(x))));
  }
  render();
}

/* ---------- Layout ---------- */
function shell(){
  const nm=S.me.name||S.user.email;
  $('#app').innerHTML=`<header><img src="${LOGO}" alt="Kamil Group">
  <input class="search" id="q" type="search" placeholder="Cari aplikasi atau divisi" value="${esc(S.q)}">
  <div class="um"><button class="btn ghost sm" data-act="menu">${esc(nm.slice(0,14))} ▾</button>
  <div id="menu" hidden><div class="who">${esc(S.user.email)}<br>${isAdmin()?'Admin':'Anggota'}</div>
  ${isAdmin()?'<button data-act="edit">Mode kelola: nyala/mati</button><button data-act="users">Kelola pengguna</button>':''}
  ${installEv?'<button data-act="install">Pasang aplikasi</button>':''}
  <button data-act="logout">Keluar</button></div></div></header>
  <div id="bar"></div><main id="main"></main>`;
  $('#q').oninput=e=>{S.q=e.target.value;render()};
}
function logo(c){return `<span class="lg">${c.logoUrl?`<img src="${esc(safe(c.logoUrl))}" alt="">`:esc((c.name||'?')[0])}</span>`}
function card(a){
  const on=S.fav.has(a.id);
  return `<a class="card" href="${esc(safe(a.url))}" target="_blank" rel="noopener noreferrer">
  <span class="ic">${esc(a.icon||(a.name||'?')[0])}</span>
  <span class="tx"><b>${esc(a.name)}</b><small>${esc(a.desc||host(a.url))}</small></span>
  <button class="fav ${on?'on':''}" data-act="fav" data-id="${a.id}" aria-label="Favorit">★</button>
  ${S.edit?`<button class="ed" data-act="editapp" data-id="${a.id}" aria-label="Ubah">✎</button>`:''}</a>`;
}
function section(c,apps){
  const g={};apps.forEach(a=>(g[a.division||'Umum']??=[]).push(a));
  const ds=Object.keys(g).sort((x,y)=>x.localeCompare(y));
  return `<section class="co"><div class="cohead" style="--c:${esc(c.color||'#C99B54')}">${logo(c)}
  <div><h2>${esc(c.name)}</h2><p>${esc(c.desc)}</p></div><span class="sp"></span>
  ${S.edit?`<button class="btn gold sm" data-act="addapp" data-id="${c.id}">+ Aplikasi</button><button class="btn ghost sm" data-act="editco" data-id="${c.id}">Ubah</button>`:''}</div>
  ${ds.map(d=>`<h4>${esc(d)}</h4><div class="grid">${g[d].sort(byN).map(card).join('')}</div>`).join('')||'<p class="empty">Belum ada aplikasi di perusahaan ini.</p>'}</section>`;
}
function render(){
  if(!$('#main'))return;
  const q=S.q.trim().toLowerCase();
  $('#bar').innerHTML=`<div class="chips">${[['all','Semua'],['fav','★ Favorit'],...S.cos.map(c=>[c.id,c.name])].map(([id,n])=>`<button class="chip ${S.sel===id?'on':''}" data-act="sel" data-id="${id}">${esc(n)}</button>`).join('')}</div>
  ${S.edit?'<div class="edbar"><span>Mode kelola aktif</span><button class="btn gold sm" data-act="addco">+ Perusahaan</button></div>':''}`;
  const list=S.sel==='all'||S.sel==='fav'?S.cos:S.cos.filter(c=>c.id===S.sel);
  let h='';
  for(const c of list){
    let as=S.apps.filter(a=>a.companyId===c.id&&(!q||[a.name,a.desc,a.division,c.name].join(' ').toLowerCase().includes(q)));
    if(S.sel==='fav')as=as.filter(a=>S.fav.has(a.id));
    if(!as.length&&(q||S.sel==='fav'))continue;
    h+=section(c,as);
  }
  if(!h)h=S.cos.length?'<p class="empty">Tidak ada aplikasi yang cocok.</p>':
    `<div class="empty">Belum ada perusahaan.${isAdmin()?'<br><br><button class="btn gold" data-act="addco">+ Perusahaan</button> <button class="btn ghost" data-act="seed">Isi data contoh</button>':'<br>Hubungi admin untuk menambahkan data.'}</div>`;
  $('#main').innerHTML=h;
}

/* ---------- Forms ---------- */
function form(title,fields,v,save,del){
  const m=$('#modal');
  const divs=[...new Set(S.apps.map(a=>a.division).filter(Boolean))];
  m.innerHTML=`<form class="box"><h3>${esc(title)}</h3>${fields.map(f=>`<label>${esc(f.l)}${f.t==='select'
    ?`<select name="${f.k}">${f.o.map(o=>`<option value="${esc(o[0])}" ${o[0]===v[f.k]?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`
    :`<input name="${f.k}" type="${f.t||'text'}" ${f.t==='file'?'accept="image/*"':`value="${esc(v[f.k])}"`} placeholder="${esc(f.p||'')}" ${f.r?'required':''} ${f.dl?'list="dl"':''}>`}</label>`).join('')}
  <datalist id="dl">${divs.map(d=>`<option value="${esc(d)}">`).join('')}</datalist>
  <div class="row">${del?'<button type="button" class="btn danger" data-x="del">Hapus</button>':''}<span class="sp"></span><button type="button" class="btn ghost" data-x="x">Batal</button><button class="btn">Simpan</button></div></form>`;
  const f=m.querySelector('form'),close=()=>m.innerHTML='';
  m.onclick=e=>{if(e.target===m)close()};
  f.onclick=async e=>{
    const x=e.target.dataset.x;
    if(x==='x')close();
    if(x==='del'&&confirm('Hapus data ini? Tindakan tidak bisa dibatalkan.')){
      try{await del();close();toast('Dihapus')}catch(err){toast(msg(err))}
    }
  };
  f.onsubmit=async e=>{
    e.preventDefault();
    const d=Object.fromEntries(new FormData(f));
    for(const k in d)if(typeof d[k]==='string')d[k]=d[k].trim();
    try{await save(d);close();toast('Tersimpan')}catch(err){toast(msg(err))}
  };
}
async function upload(file){
  const r=ref(st,`logos/${Date.now()}_${file.name.replace(/[^\w.]/g,'_')}`);
  await uploadBytes(r,file);return getDownloadURL(r);
}
function coForm(c){
  form(c?'Ubah perusahaan':'Perusahaan baru',[
    {k:'name',l:'Nama perusahaan',r:1},{k:'desc',l:'Deskripsi singkat'},{k:'color',l:'Warna aksen',t:'color'},
    {k:'logoUrl',l:'URL logo (opsional)',p:'https://...'},{k:'logoFile',l:'Atau unggah file logo',t:'file'}
  ],c||{color:'#C99B54'},async d=>{
    if(d.logoFile&&d.logoFile.size)d.logoUrl=await upload(d.logoFile);
    delete d.logoFile;
    if(c)await updateDoc(doc(db,'companies',c.id),d);else await addDoc(collection(db,'companies'),{...d,order:Date.now()});
  },c&&(async()=>{
    const b=writeBatch(db);
    S.apps.filter(a=>a.companyId===c.id).forEach(a=>b.delete(doc(db,'apps',a.id)));
    b.delete(doc(db,'companies',c.id));await b.commit();
  }));
}
function appForm(a,cid){
  form(a?'Ubah aplikasi':'Aplikasi baru',[
    {k:'companyId',l:'Perusahaan',t:'select',o:S.cos.map(c=>[c.id,c.name])},
    {k:'division',l:'Divisi',r:1,dl:1,p:'mis. Keuangan'},{k:'name',l:'Nama aplikasi',r:1},
    {k:'url',l:'Link aplikasi',r:1,p:'https://...'},{k:'desc',l:'Keterangan singkat'},{k:'icon',l:'Ikon (satu emoji)',p:'📊'}
  ],a||{companyId:cid},async d=>{
    if(!/^https?:\/\//i.test(d.url))d.url='https://'+d.url;
    if(a)await updateDoc(doc(db,'apps',a.id),d);else await addDoc(collection(db,'apps'),{...d,order:Date.now()});
  },a&&(()=>deleteDoc(doc(db,'apps',a.id))));
}
async function usersModal(){
  const snap=await getDocs(collection(db,'users')),m=$('#modal');
  const us=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.role==='pending'?-1:1)-(b.role==='pending'?-1:1)||String(a.email).localeCompare(b.email));
  m.innerHTML=`<div class="box"><h3>Kelola pengguna</h3>${us.map(u=>`<div class="urow"><div><b>${esc(u.name)}</b><br>${esc(u.email)}</div>
  <select data-uid="${u.id}" ${u.id===S.user.uid?'disabled':''}>${[['pending','Menunggu'],['member','Anggota'],['admin','Admin']].map(([v,n])=>`<option value="${v}" ${u.role===v?'selected':''}>${n}</option>`).join('')}</select></div>`).join('')}
  <div class="row"><span class="sp"></span><button class="btn ghost" data-x="x">Tutup</button></div></div>`;
  m.onclick=e=>{if(e.target===m||e.target.dataset.x==='x')m.innerHTML=''};
  m.onchange=async e=>{if(e.target.dataset.uid){try{await updateDoc(doc(db,'users',e.target.dataset.uid),{role:e.target.value});toast('Peran diperbarui')}catch(x){toast(msg(x))}}};
}
async function seed(){
  const b=writeBatch(db),mk=(n,d,c,i)=>{const r=doc(collection(db,'companies'));b.set(r,{name:n,desc:d,color:c,logoUrl:'',order:i});return r.id};
  const a=mk('PT Contoh Satu','Perusahaan kontraktor','#C99B54',1),c=mk('PT Contoh Dua','Perusahaan perdagangan','#000000',2);
  [[a,'Keuangan','ERP Keuangan','https://example.com/erp','📊'],[a,'HRD','Portal HRD','https://example.com/hr','👥'],[a,'HRD','Absensi','https://example.com/absen','🕒'],[c,'Gudang','Stok Barang','https://example.com/stok','📦']]
    .forEach(([cid,division,name,url,icon],i)=>b.set(doc(collection(db,'apps')),{companyId:cid,division,name,url,icon,desc:'',order:i}));
  await b.commit();
}

/* ---------- Actions ---------- */
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-act]');
  if(!t){const mn=$('#menu');if(mn&&!e.target.closest('.um'))mn.hidden=true;return}
  const a=t.dataset.act,id=t.dataset.id;
  if(t.tagName==='A'&&a!=='x'||t.closest('.card'))e.preventDefault();
  const m=$('#menu');if(m&&a!=='menu')m.hidden=true;
  try{
    if(a==='menu')m.hidden=!m.hidden;
    else if(a==='sel'){S.sel=id;render()}
    else if(a==='fav'){S.fav.has(id)?S.fav.delete(id):S.fav.add(id);try{localStorage.kg_fav=JSON.stringify([...S.fav])}catch{}render()}
    else if(a==='edit'){S.edit=!S.edit;render()}
    else if(a==='addco')coForm();
    else if(a==='editco')coForm(S.cos.find(c=>c.id===id));
    else if(a==='addapp')appForm(null,id);
    else if(a==='editapp')appForm(S.apps.find(x=>x.id===id));
    else if(a==='users')await usersModal();
    else if(a==='seed')await seed();
    else if(a==='logout')await signOut(auth);
    else if(a==='install'&&installEv)installEv.prompt();
    else if(a==='mode'){S.mode=S.mode==='in'?'up':'in';authView()}
    else if(a==='google')await signInWithPopup(auth,new GoogleAuthProvider());
    else if(a==='reset'){
      const em=document.querySelector('#af [name=email]').value;
      if(!em)return $('#err').textContent='Isi email dulu, lalu klik Lupa kata sandi.';
      await sendPasswordResetEmail(auth,em);toast('Tautan reset dikirim ke email Anda');
    }
  }catch(x){toast(msg(x))}
});

if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js').catch(()=>{}));
</script>
</body>
</html>
